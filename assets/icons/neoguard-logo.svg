<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Background Shield Gradient: Deep Navy Blue to Medical Cyan Blue -->
    <linearGradient id="shieldGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Justice Green to Soft Mint Gradient for Healthcare & Growth -->
    <linearGradient id="greenGrad" x1="16" y1="12" x2="32" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Protective Shield with Subtle Rounded Geometry -->
  <path
    d="M24 4L7 10.5V23.2C7 33.8 14.3 43.1 24 45.5C33.7 43.1 41 33.8 41 23.2V10.5L24 4Z"
    fill="url(#shieldGrad)"
    filter="url(#softGlow)"
    stroke="#38bdf8"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Inner Soft Medical Aura -->
  <path
    d="M24 7.2L10 12.5V23C10 31.8 16 39.5 24 42C32 39.5 38 31.8 38 23V12.5L24 7.2Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.15)"
    stroke-width="1"
  />

  <!-- Central Pediatric Cross & Swaddle Motif in Justice Emerald Green -->
  <g fill="url(#greenGrad)">
    <!-- Vertical Medical Bar with Rounded Caps -->
    <rect x="21" y="14" width="6" height="20" rx="3" />
    <!-- Horizontal Medical Bar with Rounded Caps -->
    <rect x="14" y="21" width="20" height="6" rx="3" />
  </g>

  <!-- Gentle Neonatal Vital Heart/Care Spark Center Dot in Radiant Cyan -->
  <circle cx="24" cy="24" r="2.4" fill="#ffffff" />
  <circle cx="24" cy="24" r="1.2" fill="#0284c7" />

  <!-- Dual Infant Comfort Arcs (Blue for Boy, Green for Girl) -->
  <path
    d="M17 14C19 12.5 22 12 24 12"
    stroke="#38bdf8"
    stroke-width="2"
    stroke-linecap="round"
  />
  <path
    d="M24 36C27 36 30 34.5 32 32"
    stroke="#34d399"
    stroke-width="2"
    stroke-linecap="round"
  />
</svg>
